<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>BI Profily</title>
    <script>
      // Apply stored language/theme before first paint (avoids a flash). Keys: bip:v1:*
      (function () {
        try {
          var lang = localStorage.getItem('bip:v1:lang');
          if (lang === 'ru' || lang === 'kk') document.documentElement.lang = lang;
          var theme = localStorage.getItem('bip:v1:theme');
          if (theme !== 'light' && theme !== 'dark') theme = 'light'; // light unless the user chose dark
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          /* storage unavailable: defaults apply */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
